# Every pull request, and main. Nothing here touches the server; deploying is
# deploy.yml. Taken from stewards.
#
# The trigger is `pull_request`, never `pull_request_target`. This repository is
# public, so a pull request can come from anybody's fork, and
# `pull_request_target` would run that fork's code with this repository's
# token and secrets. Under `pull_request` a fork gets a read-only token and no
# secrets at all -- and this workflow needs neither.
#
# The steps are separate rather than one `make test`, so that a red run names
# which of them failed on its own line instead of making somebody read the log
# to find out.
#
# Actions are pinned to a commit rather than a tag. A tag is a moving pointer
# its owner can repoint, and a third-party action runs with access to this
# workflow's token -- so "v7" means "whatever v7 happens to be that morning".
name: ci

on:
  pull_request:
  push:
    branches: [main]

  # For go-version.yml. A pull request opened with the repository's token
  # triggers no workflows, so the Go version pull request would never get a
  # CI run and the merge workflow would never see it green; dispatching is
  # the one way a workflow may start another, and it starts this one on the
  # branch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # From go.mod, so the toolchain in CI is the one the module declares
          # and there is no second place to bump.
          go-version-file: go.mod
          cache: true

      - name: poppler, for the PDF statement tests
        # The server reads PDF statements with poppler's pdftotext; without
        # it here those tests skip, and a skipped test checks nothing.
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends poppler-utils

      - name: lint
        run: make lint

      - name: unit tests, with the race detector
        run: make test-unit

      - name: shell tests
        run: make shell-test

      # The share page's script and its service worker are plain
      # JavaScript modules with no build step, so nothing else would
      # notice them breaking until somebody shared a month of checks.
      # Node's own test runner, so there is nothing to install from npm;
      # Node itself is pinned here because the browser tests need 22 or
      # later and the runner's own may be older. Taken from stewards.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: JavaScript tests
        run: make test-js

      # In the runner's own Chrome, against a server built from this
      # commit: a share caught by the worker under the real header policy.
      # CI is set here, so a missing Chrome fails this step rather than
      # skipping it.
      - name: browser tests
        timeout-minutes: 10
        run: make test-browser

      - name: vulnerability scan
        run: make vuln-check

      - name: the release build is static
        # Not a duplicate of `go build`. The server has no Go toolchain and gets
        # one file, so a build that quietly links this runner's glibc is a
        # deploy that dies on the host. `make release` asserts the result is
        # statically linked.
        run: make release
